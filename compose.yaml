version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: postgres-dealsafe
    build: ./database
    restart: unless-stopped
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 15s
      retries: 5
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./initialdb.sql:/docker-entrypoint-initdb.d/initialdb.sql
  pgadmin:
    container_name: pgadmin-dealsafe
    image: dpage/pgadmin4:9.0
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=root@root.com
      - PGADMIN_DEFAULT_PASSWORD=root
    ports:
      - "5050:80"
    volumes:
      - pgadmin:/var/lib/pgadmin:rw

  mongodb:
    image: mongo:8.0
    container_name: mongo-dealsafe
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongoadmin
      - MONGO_INITDB_ROOT_PASSWORD=secret
    volumes:
      - mongo_data:/data/db

  neo4j:
    image: neo4j:5.25.1-community
    ports:
      - 7888:7474
      - 7999:7687
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - ./db/data:/data
      - ./db/conf:/conf
      - ./db/logs:/logs
      - ./db/plugins:/plugins

volumes:
  postgres:
    external: false
  pgadmin:
    external: false
  mongo_data:
    external: false

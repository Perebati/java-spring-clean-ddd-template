server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: Dealsafe-Dev
  datasource:
    url: jdbc:postgresql://localhost:5432/motorRegra?createDatabaseIfNotExist=true&useSSL=false
    username: postgres
    password: postgres
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
  data:
    mongodb:
      host: localhost
      port: 27017
      database: dealsafe_logs
      username: mongoadmin
      password: secret
      authentication-database: admin

jwt:
  publicKey: ${JWT_PUBLIC_KEY}
  privateKey: ${JWT_PRIVATE_KEY}
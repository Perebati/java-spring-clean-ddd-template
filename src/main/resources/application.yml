server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: dealsafe
  datasource:
    url: jdbc:postgresql://localhost:5432/motorRegra
    username: postgres
    password: postgres
    driverClassName: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
    hibernate:
      ddl-auto: update

  data:
    mongodb:
      host: localhost
      port: 27017
      database: dealsafe_logs
      username: mongoadmin
      password: secret
      authentication-database: admin
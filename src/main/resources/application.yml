server:
  port: ${SERVER_PORT}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}
        default_schema: ${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA}

jwt:
  publicKey: ${JWT_PUBLIC_KEY}
  privateKey: ${JWT_PRIVATE_KEY}
  data:
    mongodb:
      host: ${JWT_DATA_MONGODB_HOST}
      port: ${JWT_DATA_MONGODB_PORT}
      database: ${JWT_DATA_MONGODB_DATABASE}
      username: ${JWT_DATA_MONGODB_USERNAME}
      password: ${JWT_DATA_MONGODB_PASSWORD}
      authentication-database: ${JWT_DATA_MONGODB_AUTHENTICATION_DATABASE}